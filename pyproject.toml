[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microplastic-ai-monitor"
version = "0.1.0"
description = "Research prototype: AI microplastic detection (segmentation + features + ML) and monitoring-network analytics on synthetic multispectral filter images."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - research prototype" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
mpmon = "mpmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
